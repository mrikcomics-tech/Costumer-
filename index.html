<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة زبائن - الحاج عيسى للسفر والعمرة</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
</head>
<body>
    <header>
        <h1>وكالة الحاج عيسى للسفر والعمرة</h1>
        <button id="syncBtn" onclick="syncData()">مزامنة 🔄</button>
    </header>
    <div id="statusMsg"></div>

    <main>
        <section class="form-section">
            <h2>إضافة زبون جديد</h2>
            <form id="customerForm">
                <input type="text" id="name" placeholder="الاسم" required>
                <input type="tel" id="phone" placeholder="رقم الهاتف" required>
                <input type="text" id="wilaya" placeholder="الولاية" required>
                <input type="text" id="request" placeholder="الطلب / الرحلة" required>
                <select id="role">
                    <option value="معتمر">معتمر</option>
                    <option value="مسافر">مسافر</option>
                    <option value="معلن">معلن</option>
                    <option value="مرشد">مرشد</option>
                </select>
                <button type="submit">حفظ الزبون محلياً</button>
            </form>
        </section>

        <section class="list-section">
            <h2>السجلات المحلية الحديثة</h2>
            <div id="customersList"></div>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
